[project]
name = "hydra"
version = "0.1.0"
description = "AI agent orchestration engine with context forking"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "pyyaml>=6.0",
]

[project.scripts]
hydra = "hydra.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
