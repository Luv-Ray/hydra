[project]
name = "hydra"
version = "1.0.0"
description = "AI agent orchestration engine"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.178",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.scripts]
hydra = "hydra.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
