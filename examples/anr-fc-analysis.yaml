name: anr-fc-analysis
version: 1

inputs:
  issue_id:
    description: "IPD 问题单号（issId）"
    required: true

defaults:
  model: claude-sonnet-4-6
  retry: 1
  timeout: 600
  allowed_tools: [Read, Write, Bash, Glob, Grep]

workdir: /tmp/hydra-anr-analysis

steps:
  # 1. 拉取 IPD 单信息和日志到本地
  - id: fetch_issue
    prompt: |
      使用 MCP 工具获取 IPD 问题单 {{ inputs.issue_id }} 的详细信息：

      1. 调用 M_queryIssueDetailLinks 获取该单的附件和评论中的日志链接
         参数: issId = "{{ inputs.issue_id }}"
      2. 如果有下载命令，执行下载，把日志保存到 logs/ 目录
      3. 将问题单的标题、描述、状态、关键字段整理到 issue-info.md

      确保所有日志文件都下载到 logs/ 目录下。
    output: issue-info.md

  # 2. 读取知识库
  - id: read_knowledge
    prompt: |
      阅读以下知识库目录中的所有文档，理解 ANR/FC 问题的分析方法论：
      目录：/path/to/knowledge-base/

      总结你学到的分析框架和关键排查步骤，输出为结构化的分析指南。
    output: analysis-guide.md

  # 3. 根因分析（基于知识库指导 + 日志数据）
  - id: analyze
    after: [fetch_issue, read_knowledge]
    inject:
      - issue-info.md
      - analysis-guide.md
      - "logs/*.txt"
      - "logs/*.log"
    model: claude-opus-4-6
    prompt: |
      根据知识库的分析方法论，结合日志数据，分析这个 ANR/FC 问题的根因。

      要求：
      1. 按知识库中的分析框架逐步排查
      2. 引用具体的日志行作为证据
      3. 给出根因结论和修复建议
      4. 标注置信度（高/中/低）和不确定的部分
    output: root-cause.md

  # 4. 对抗性审查：质疑根因分析
  - id: challenge
    inject: [issue-info.md, root-cause.md]
    prompt: |
      你是一位资深的 Android 系统工程师，负责审查根因分析报告。

      请对上述分析提出对抗性质疑：
      1. 证据链是否充分？有没有跳跃推理？
      2. 是否存在其他可能的根因被忽略？
      3. 日志证据是否能排除其他可能性？
      4. 修复建议是否可能引入新问题？

      对每个质疑点给出 "成立/不成立" 的判断和理由。
    output: challenge.md

  # 5. 最终结论：综合审查意见修正分析
  - id: final_report
    resume: analyze
    after: [challenge]
    inject: [challenge.md]
    prompt: |
      审查者提出了对你分析的质疑。请：
      1. 逐一回应每个质疑点
      2. 如果质疑成立，修正你的分析
      3. 输出最终的根因分析报告，包含：
         - 问题概述
         - 根因结论
         - 证据链
         - 修复建议
         - 已排除的其他可能性
    output: final-report.md
