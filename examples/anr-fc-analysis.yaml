name: anr-fc-analysis
version: 1

inputs:
  issue_id:
    description: "IPD 问题单号（issId）"
    required: true

defaults:
  model: claude-sonnet-4-6
  retry: 1
  timeout: 600
  allowed_tools: [Read, Write, Edit, Bash, Glob, Grep]

workdir: "./{{ inputs.issue_id }}"

steps:
  # 1. 拉取 IPD 单信息和日志到本地
  - id: fetch_issue
    prompt: |
      使用 MCP 工具获取 IPD 问题单 {{ inputs.issue_id }} 的详细信息：

      1. 调用 M_queryIssueDetailLinks 获取该单的附件和评论中的日志链接
         参数: issId = "{{ inputs.issue_id }}"
      2. 如果有下载命令，执行下载，把日志保存到 logs/ 目录
      3. 将问题单的标题、描述、状态、关键字段整理到 issue-info.md

      确保所有日志文件都下载到 logs/ 目录下。
    output: issue-info.md

  # 2. 读取知识库
  - id: read_knowledge
    prompt: |
      阅读以下知识库目录中的所有文档，理解 ANR/FC 问题的分析方法论：
      目录：/path/to/knowledge-base/

      总结你学到的分析框架和关键排查步骤，输出为结构化的分析指南。
    output: analysis-guide.md

  # 3. 根因分析
  - id: analyze
    after: [fetch_issue, read_knowledge]
    inject:
      - issue-info.md
      - analysis-guide.md
    model: claude-opus-4-6
    prompt: |
      日志文件在 logs/ 目录下，请用 Read/Grep 工具按需查阅。

      根据知识库的分析方法论，结合日志数据，分析这个 ANR/FC 问题的根因。

      要求：
      1. 按知识库中的分析框架逐步排查
      2. 引用具体的日志行作为证据
      3. 给出根因结论和修复建议
      4. 标注置信度（高/中/低）和不确定的部分
    output: root-cause.md

  # 4. 并行多维度审查
  - id: challenge_evidence
    after: [analyze]
    inject: [issue-info.md, root-cause.md]
    prompt: |
      你是一位资深 Android 系统工程师。日志在 logs/ 目录下可自行查阅。

      从证据链角度审查根因分析报告：
      1. 每条证据是否准确引用了日志原文？
      2. 推理链是否有跳跃？前提是否成立？
      3. 有没有对日志的误读或断章取义？

      列出所有问题，给出严重程度（高/中/低）。
    output: review-evidence.md

  - id: challenge_alternatives
    after: [analyze]
    inject: [issue-info.md, root-cause.md]
    prompt: |
      你是一位资深 Android 系统工程师。日志在 logs/ 目录下可自行查阅。

      从根因完备性角度审查：
      1. 是否存在其他可能的根因被忽略？
      2. 日志证据是否能排除这些替代可能？
      3. 是否找到了真正的根因，而非表层现象？

      列出所有被忽略的可能性，评估其概率。
    output: review-alternatives.md

  - id: challenge_fix
    after: [analyze]
    inject: [issue-info.md, root-cause.md]
    prompt: |
      你是一位资深 Android 系统工程师。

      从修复方案角度审查：
      1. 修复建议是否针对真正的根因？
      2. 修复是否可能引入新问题或性能退化？
      3. 是否有更简单或更安全的替代方案？

      列出所有风险点和改进建议。
    output: review-fix.md

  # 5. 汇总裁决
  - id: verdict
    after: [challenge_evidence, challenge_alternatives, challenge_fix]
    inject: [root-cause.md, review-evidence.md, review-alternatives.md, review-fix.md]
    prompt: |
      综合以上三个维度的审查意见，给出最终裁决。

      判定标准：
      - 如果存在任何"高"严重度问题 → REJECT
      - 如果存在多个"中"严重度问题 → REJECT
      - 其余情况 → ACCEPT

      输出：
      1. 逐条引用各审查的关键发现
      2. 如果 REJECT，明确列出需要修正的要点
      3. 最后一行只写 ACCEPT 或 REJECT
    output: challenge.md
    check:
      success_pattern: "ACCEPT"
    routes:
      - if: success
        goto: final_report
      - if: failure
        goto: revise

  # 6. 修正分析（回跳后重新走审查流程）
  - id: revise
    trigger: route
    resume: analyze
    inject: [challenge.md]
    max_iterations: 3
    prompt: |
      审查者对你的分析判定 REJECT。汇总意见见上方注入的文件。

      请：
      1. 逐一回应每个需要修正的要点
      2. 直接编辑 root-cause.md 修正分析
      3. 只改需要改的部分，不要重写全文
    routes:
      - if: success
        goto: [challenge_evidence, challenge_alternatives, challenge_fix]

  # 7. 最终报告
  - id: final_report
    trigger: route
    inject: [issue-info.md, root-cause.md, challenge.md]
    prompt: |
      整理最终的根因分析报告，包含：
      - 问题概述
      - 根因结论
      - 证据链（引用日志行）
      - 修复建议
      - 已排除的其他可能性
      - 审查过程摘要
    output: final-report.md
