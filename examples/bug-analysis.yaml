name: "bug-analysis-pipeline"
workdir: "."

steps:
  # 1. 调查：从零开始
  - id: investigate
    prompt: |
      阅读代码库，排查以下 bug 的根因：
      用户反馈：登录后偶发 session 丢失，约 5% 请求返回 401。
      输出你的分析结论和修复方案。
    output: "reports/investigation.md"

  # 2. 多路审查：只拿结论，各自独立
  - id: security_review
    output_from: investigate
    inject:
      - text: "你是一位安全专家。"
    prompt: "从安全角度审查上述分析和修复方案。找出潜在的安全风险。"
    output: "reports/security.md"

  - id: perf_review
    output_from: investigate
    prompt: "从性能角度审查修复方案。高并发下是否有问题？"
    output: "reports/perf.md"

  - id: correctness_review
    output_from: investigate
    prompt: "构造边界条件和极端场景，找出方案中的逻辑漏洞。"
    output: "reports/correctness.md"

  # 3. 综合：继承完整上下文 + 注入审查结论
  - id: final_fix
    fork_from: investigate
    inject:
      - output_of: security_review
      - output_of: perf_review
      - output_of: correctness_review
    prompt: "综合以上审查意见，实现最终修复。确保所有审查意见都被考虑到。"

  # 4. 独立任务：基于修复结果更新文档
  - id: update_docs
    inject:
      - output_of: final_fix
    prompt: "根据修复内容更新 CHANGELOG.md。"
    output: "CHANGELOG.md"
