name: bug-analysis-pipeline
version: 1

inputs:
  bug_desc:
    description: "Bug 描述"
    default: "登录后偶发 session 丢失，约 5% 请求返回 401"

defaults:
  model: claude-sonnet-4-6
  retry: 1
  timeout: 300
  allowed_tools: [Read, Edit, Write, Bash, Glob, Grep]

workdir: "."

steps:
  # 1. 调查：从零开始
  - id: investigate
    model: claude-opus-4-6
    prompt: |
      阅读代码库，排查以下 bug 的根因：
      用户反馈：{{ inputs.bug_desc }}
      输出你的分析结论和修复方案。
    output: reports/investigation.md

  # 2. 多路审查：独立判断（inject 文件，不继承 session）
  - id: security_review
    inject: [reports/investigation.md]
    prompt: "你是一位安全专家。从安全角度审查上述分析和修复方案。找出潜在的安全风险。"
    output: reports/security.md

  - id: perf_review
    inject: [reports/investigation.md]
    prompt: "从性能角度审查修复方案。高并发下是否有问题？"
    output: reports/perf.md

  - id: correctness_review
    inject: [reports/investigation.md]
    prompt: "构造边界条件和极端场景，找出方案中的逻辑漏洞。"
    output: reports/correctness.md

  # 3. 综合修复：resume investigate 继承上下文，注入审查文件
  - id: final_fix
    resume: investigate
    after: [security_review, perf_review, correctness_review]
    inject: [reports/security.md, reports/perf.md, reports/correctness.md]
    prompt: "综合以上审查意见，实现最终修复。确保所有审查意见都被考虑到。"
    retry: 2
    retry_inject: check_output
    check:
      prompt: "运行测试套件，全部通过了吗？只回答 yes 或 no"
      success_pattern: "yes"
    routes:
      - if: success
        goto: update_docs
      - if: failure
        goto: failure_report

  # 4. 成功路径
  - id: update_docs
    trigger: route
    inject: [reports/investigation.md]
    prompt: "根据修复内容更新 CHANGELOG.md。"
    output: CHANGELOG.md

  # 5. 失败路径
  - id: failure_report
    trigger: route
    inject: [reports/investigation.md, reports/security.md, reports/perf.md, reports/correctness.md]
    prompt: "自动修复失败。生成问题总结报告，列出已尝试的方案和失败原因。"
    output: reports/failure.md
